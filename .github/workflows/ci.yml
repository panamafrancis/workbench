name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: binary
          skip-pkg-cache: true
          skip-build-cache: true
      - run: make ci

  e2e-linux:
    runs-on: ubuntu-latest
    needs: ci
    env:
      ZELLIJ_VERSION: v0.45.1
      # sha256 of the zellij binary inside the release tarball
      ZELLIJ_SHA256: d006c521dcb475a6005d741e9dd7c5758e5a23b28dd60a5c10cebfa4876319dd
      NONO_VERSION: v0.80.0
      NONO_SHA256: 6da665b61999570c10dffc7da78828fe1fb7f3cac53319e505cebecaef17037f
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install zellij
        run: |
          curl -fsSL "https://github.com/zellij-org/zellij/releases/download/${ZELLIJ_VERSION}/zellij-x86_64-unknown-linux-musl.tar.gz" | tar xz
          echo "${ZELLIJ_SHA256}  zellij" | sha256sum -c -
          sudo mv zellij /usr/local/bin/
          zellij --version

      - name: Install nono
        run: |
          tarball="nono-${NONO_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLO "https://github.com/always-further/nono/releases/download/${NONO_VERSION}/${tarball}"
          echo "${NONO_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "${tarball}"
          sudo mv nono /usr/local/bin/
          nono --version

      - name: Build workbench
        run: go build -ldflags="-s -w" -o dist/workbench .

      - name: Run e2e tests
        run: PATH="$(pwd)/dist:$PATH" bash scripts/e2e.sh
